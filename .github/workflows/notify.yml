name: LOXA → Telegram

# Проверяет сайт каждые 10 минут и отправляет новое в канал.
# Первый запуск только запоминает уже существующие материалы (без спама).
on:
  schedule:
    # ВНИМАНИЕ: время в UTC. */10 = каждые 10 минут (минимум у GitHub — 5).
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать, ничего не отправлять"
        type: boolean
        default: false
      force:
        description: "Игнорировать state.json (переслать всё найденное)"
        type: boolean
        default: false
      announce_baseline:
        description: "Отправить и уже существующие материалы"
        type: boolean
        default: false

# Не даём запускам накладываться друг на друга
concurrency:
  group: loxa-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # нужно, чтобы коммитить state.json
    steps:
      - name: Получить код
        uses: actions/checkout@v4
        with:
          # Важно: забираем всю историю, чтобы merge работал нормально
          fetch-depth: 0
          # Важно: используем токен с правами на пуш
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Проверить сайт и отправить новое
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://loxa-rpg.vercel.app' }}
          LOCALE: ${{ vars.LOCALE || 'ru' }}
          PARSE_MODE: ${{ vars.PARSE_MODE || 'HTML' }}
          MESSAGE_MAX_CHARS: "3800"
          MAX_MESSAGE_PARTS: "4"
          SEND_MARKDOWN_FILE: "true"
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then FLAGS="$FLAGS --force"; fi
          if [ "${{ inputs.announce_baseline }}" = "true" ]; then FLAGS="$FLAGS --announce-baseline"; fi
          echo "Запуск: python bot.py check $FLAGS"
          python bot.py check $FLAGS

      - name: Сохранить state.json в репозиторий
        if: ${{ inputs.dry_run != true }}
        run: |
          set -e  # прерываем при любой ошибке

          # Проверяем, изменился ли state.json
          if git diff --quiet -- state.json && [ -f state.json ]; then
            echo "state.json не изменился, выходим"
            exit 0
          fi

          # Настраиваем git
          git config user.name "loxa-notifier-bot"
          git config user.email "loxa-notifier-bot@users.noreply.github.com"

          # Коммитим изменения
          git add state.json || true
          if git diff --cached --quiet; then
            echo "Нечего коммитить"
            exit 0
          fi

          git commit -m "chore(state): $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Ветка, в которую пушим
          BRANCH="${GITHUB_REF_NAME:-main}"

          # Retry-цикл: пробуем запушить до 5 раз
          for i in 1 2 3 4 5; do
            echo "=== Попытка пуша #$i ==="

            # Пробуем запушить
            if git push origin "$BRANCH"; then
              echo "✅ Успешно запушено с попытки #$i"
              exit 0
            fi

            echo "⚠️ Пуш не удался, подтягиваем свежие изменения..."

            # Подтягиваем свежее БЕЗ rebase (rebase ломает HEAD в CI)
            if ! git fetch origin "$BRANCH"; then
              echo "❌ Не удалось сделать fetch"
              exit 1
            fi

            # Мержим удалённую ветку в локальную
            # При конфликте в state.json — берём НАШУ версию (свежие данные)
            if ! git merge --no-rebase -X ours "origin/$BRANCH" -m "chore: auto-merge state [skip ci]"; then
              echo "⚠️ Merge с конфликтом, разрешаем вручную..."

              # Если конфликт — берём НАШ state.json
              git checkout --ours state.json 2>/dev/null || true
              git add state.json

              # Завершаем merge
              git commit -m "chore: resolve state.json conflict [skip ci]" || true
            fi

            # Небольшая пауза перед следующей попыткой
            sleep 2
          done

          echo "❌ Не удалось запушить после 5 попыток"
          exit 1

name: LOXA → Telegram

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать, ничего не отправлять"
        type: boolean
        default: false
      force:
        description: "Игнорировать state.json (переслать всё найденное)"
        type: boolean
        default: false
      announce_baseline:
        description: "Отправить и уже существующие материалы"
        type: boolean
        default: false

concurrency:
  group: loxa-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment: TELEGRAM_BOT_TOKEN

    steps:
      - name: Получить код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Проверить сайт и отправить новое
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://loxa-rpg.vercel.app' }}
          LOCALE: ${{ vars.LOCALE || 'ru' }}
          PARSE_MODE: ${{ vars.PARSE_MODE || 'HTML' }}
          MESSAGE_MAX_CHARS: "3800"
          MAX_MESSAGE_PARTS: "4"
          SEND_MARKDOWN_FILE: "true"
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then FLAGS="$FLAGS --force"; fi
          if [ "${{ inputs.announce_baseline }}" = "true" ]; then FLAGS="$FLAGS --announce-baseline"; fi
          echo "Запуск: python bot.py check $FLAGS"
          python bot.py check $FLAGS

      - name: Сохранить state.json в репозиторий
        if: ${{ inputs.dry_run != true }}
        run: |
          set -e
          if git diff --quiet -- state.json && [ -f state.json ]; then
            echo "state.json не изменился"
            exit 0
          fi
          git config user.name "loxa-notifier-bot"
          git config user.email "loxa-notifier-bot@users.noreply.github.com"
          git add state.json || true
          if git diff --cached --quiet; then
            echo "Нечего коммитить"
            exit 0
          fi
          git commit -m "chore(state): $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"

          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3 4 5; do
            echo "=== Попытка #$i ==="
            if git push origin "$BRANCH"; then
              echo "✅ Запушено"
              exit 0
            fi
            git fetch origin "$BRANCH"
            if ! git merge --no-rebase -X ours "origin/$BRANCH" -m "chore: auto-merge [skip ci]"; then
              git checkout --ours state.json 2>/dev/null || true
              git add state.json
              git commit -m "chore: resolve conflict [skip ci]" || true
            fi
            sleep 2
          done
          exit 1

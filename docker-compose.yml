services:
  # Разовая проверка — запускать из cron хоста:  docker compose run --rm notifier
  notifier:
    build: .
    image: loxa-notifier
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: "no"

  # Постоянно работающий режим: проверяет сайт каждые 10 минут и спит.
  # Удобно там, где есть бесплатный 24/7 контейнер (Oracle Cloud, Koyeb, Fly.io).
  scheduler:
    build: .
    image: loxa-notifier
    env_file: .env
    volumes:
      - ./data:/app/data
    environment:
      CHECK_INTERVAL_SECONDS: "600"
    command: >
      sh -c 'while true; do
        echo "[$(date -u +%FT%TZ)] проверка...";
        python bot.py check || echo "ошибка, повторю позже";
        sleep "$${CHECK_INTERVAL_SECONDS}";
      done'
    restart: unless-stopped
    profiles: ["always-on"]
